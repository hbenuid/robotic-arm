[project]
name = "robotic-arm"
version = "0.2.0"
description = "Drives the robotic-arm's MKS SERVO42D boards over CAN: the robotic_arm package and its CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "python-can>=4.6.1",
]

[project.scripts]
launcher = "robotic_arm.launcher:main"
motor-control = "robotic_arm.motor_control:main"
dashboard = "robotic_arm.dashboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotic_arm"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.9",
    "ty>=0.0.111",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint only (`uv run ruff check`); `ruff format` is not adopted. The repo's cad/ is its own uv project with its
# own [tool.ruff] (`./cadtool lint` there).

[tool.ruff.lint]
# ruff's default rule set (fixed by the locked ruff version; a ruff bump may add rules) plus the commonly used
# families in full: pycodestyle errors, pyflakes, isort, pyupgrade, bugbear, simplify.
extend-select = ["E", "F", "I", "UP", "B", "SIM"]
# F401 is reported, never auto-removed: fix-on-save (VS Code) would delete an import typed before its first use.
unfixable = ["F401"]
ignore = [
    "E501",    # line length: no formatter, long lines are house style
    "E741",    # ambiguous names (l / I / O): allowed where they are the domain's own symbols
    "SIM300",  # "yoda" flips `x <= LIMIT`: it takes any UPPER_CASE name for a constant; the asserts read value-first
]

[tool.ty]
# Type check (`uv run ty check`): ty's own rules, every one at its default level - none switched off here. A
# warning fails the check too, as a ruff finding does: the project stays at zero (`# ty: ignore[<rule>]` with its
# reason where a finding is wrong). The repo's cad/ has its own [tool.ty] (`./cadtool lint` there).

[tool.ty.terminal]
error-on-warning = true
