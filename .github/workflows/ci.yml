# CI: a clean clone on fresh Linux runners - lint both uv projects, both test suites, and build the arm from the
# committed inputs only (no ~/.cache/cad, no raw SolidWorks exports, no generated STEPs). It checks and never writes:
# no hash gate (STEP bytes differ per machine), no snapshots, no commits. Manual only: Actions tab -> CI -> Run
# workflow, or `gh workflow run ci.yml --ref <branch>` - when to run it: root AGENTS.md "CI".
# The jobs run side by side, each on a runner of its own (a public repo's ubuntu-24.04: 4 vCPUs, 16 GB): the run takes
# as long as its slowest job - one of the slow lane's parts or the arm build - not their sum. A CAD job starts a
# Python process per cad server worker and per pytest worker, so its venv is synced with compiled bytecode
# (`cadtool`'s PYTHONDONTWRITEBYTECODE keeps each from writing its own). The jobs that build or validate install the
# pinned cad-server first (`./cadtool server`), as a machine does; the fast lane needs none.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer run on the same branch cancels the one in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + fast lane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # exact tags only: setup-uv publishes no floating major tag (v10)
        with:
          cache-python: true

      # the tests run on python-can's virtual bus and simulated boards: no CAN hardware on a runner
      - name: Motor control - sync, lint, tests
        working-directory: software/control
        run: |
          uv sync --frozen
          uv run --frozen ruff check
          uv run --frozen pytest -p no:cacheprovider

      - name: CAD - sync + OCP kernel check
        working-directory: cad
        run: |
          uv sync --frozen --compile-bytecode
          uv run --frozen python -c "import OCP.gp"
      - name: CAD - lint
        working-directory: cad
        run: ./cadtool lint
      - name: CAD - fast lane
        working-directory: cad
        run: ./cadtool pytest -m "not slow" -p no:cacheprovider

  slow:
    name: Slow lane (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false  # one part failing still reports the others
      matrix:
        include:
          # tests/test_sweeps.py, a few long sweeps: its tests go to the workers one by one, an idle worker taking a
          # waiting one (--dist=worksteal; each worker builds the arm's shapes once), not as one file
          - part: sweeps
            args: --dist=worksteal tests/test_sweeps.py
          # the other slow tests, a whole file per worker (pyproject.toml --dist=loadfile). The longest files are named
          # outright, one per worker of their part (a file named outright runs even where a glob leaves it out); the
          # two catch-all parts leave out every file a part names, so a new test file always lands in one of them.
          # Rebalance from the parts' --durations when one part runs well past the others.
          - part: mounts, gauges, assembly, robot
            args: tests/test_mounts.py tests/test_gauges.py tests/test_assembly.py tests/test_robot.py
          - part: tests/test_*.py
            args: >-
              --ignore=tests/test_sweeps.py --ignore=tests/test_mounts.py --ignore=tests/test_gauges.py
              --ignore=tests/test_assembly.py --ignore=tests/test_robot.py --ignore-glob='tests/*/*'
          - part: tests/forearm/
            args: tests/forearm
          - part: tests/*/
            args: --ignore-glob='tests/test_*.py' --ignore=tests/forearm
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true

      - name: CAD - sync
        working-directory: cad
        run: |
          uv sync --frozen --compile-bytecode
          echo "runner: $(nproc) vCPUs, $(free -g | awk '/^Mem:/ {print $2}') GB"
      - name: CAD - the pinned server
        working-directory: cad
        run: ./cadtool server
      - name: CAD - slow tests
        working-directory: cad
        run: ./cadtool pytest -m slow -n 4 -p no:cacheprovider -rs --durations=15 ${{ matrix.args }}

  arm:
    name: Build the arm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true

      - name: CAD - sync
        working-directory: cad
        run: uv sync --frozen --compile-bytecode
      - name: CAD - the pinned server
        working-directory: cad
        run: ./cadtool server
      - name: CAD - build the arm
        working-directory: cad
        run: ./cadtool gen assemblies/arm.py
