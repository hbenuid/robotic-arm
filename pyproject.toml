[project]
name = "robotic-arm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "python-can>=4.6.1",
]

[project.scripts]
launcher = "launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["launcher.py", "motor_control.py", "src"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
# Lint only (`uv run ruff check`); `ruff format` is not adopted. cad/ is its own uv project with its own
# [tool.ruff] (`./cadtool lint` there).
extend-exclude = ["cad"]

[tool.ruff.lint]
# ruff's default rule set (fixed by the locked ruff version; a ruff bump may add rules) plus the commonly used
# families in full: pycodestyle errors, pyflakes, isort, pyupgrade, bugbear, simplify.
extend-select = ["E", "F", "I", "UP", "B", "SIM"]
# F401 is reported, never auto-removed: fix-on-save (VS Code) would delete an import typed before its first use.
unfixable = ["F401"]
ignore = [
    "EXE001",  # launcher.py / motor_control.py keep their shebangs but run as `uv run launcher`
    "E501",    # line length: no formatter, long lines are house style
    "E741",    # ambiguous names (l / I / O): allowed where they are the domain's own symbols
    "SIM300",  # "yoda" flips `x <= LIMIT`: it takes any UPPER_CASE name for a constant; the asserts read value-first
]
