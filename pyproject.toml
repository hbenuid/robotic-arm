[project]
name = "robotic-arm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyserial>=3.5",
    "python-can>=4.6.1",
]

[project.scripts]
launcher = "launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["launcher.py", "motor_control.py", "src"]
