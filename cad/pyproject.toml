[project]
name = "robotic-arm-cad"
version = "0.1.0"
description = "Parametric build123d CAD for the desktop robotic arm (converted from SolidWorks STEP exports)."
readme = "README.md"
# The venv is pinned to 3.12 (.python-version): the system Python is 3.14, the OCP
# wheels are verified on 3.12, and cadgen (the text-to-cad runtime) needs >=3.11.
requires-python = ">=3.11,<3.14"
dependencies = [
    # cadgen 0.6.x requires build123d>=0.11.1,<0.12 and cadquery-ocp-novtk>=7.9,<8 (LazyCompound
    # needs 0.11's `wrapped` property, its STEP writer needs OCP 7.9's HArray1.Value, and OCCT 7.8.1
    # mis-read its BinTools VERSION_4 component objects). The novtk pin freezes the kernel behind the
    # committed STEPs (their bytes are deterministic per kernel; build123d only asks for a range).
    # Never install cadquery-ocp (the VTK build) alongside: both distributions own the same OCP/
    # files, so removing either one guts the other (`uv sync --reinstall-package cadquery-ocp-novtk`).
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
    # The text-to-cad runtime (decorators, `cadgen` CLI, viewer, snapshots via the [snapshot]
    # extra = playwright). Same version as the installed cad@text-to-cad plugin, whose
    # skills/cad/requirements.txt pins it: bump both together (`./cadtool doctor` checks).
    "cadgen[snapshot]==0.6.6",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
# rootdir is cad/; put it on sys.path so `import parts` / `from lib ...` resolve
# (cadtool exports PYTHONPATH=cad/ for everything else, .env covers VS Code - no path shims).
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: builds/imports real OCCT geometry (deselect with -m 'not slow')",
]
filterwarnings = [
    # build123d fires these from a class body at import time; third-party noise.
    "ignore::DeprecationWarning:build123d.objects_curve",
]

[tool.ruff]
# Lint only (`./cadtool lint`); `ruff format` is not adopted: the tables (OCCURRENCES, the tagged
# constants in lib/params.py) are hand-aligned and the formatter would re-flow nearly every file.
# line-length only sets where isort wraps an import (E501 is not selected).
line-length = 120

[tool.ruff.lint]
# ruff's default rule set - fixed by the locked ruff version, so a ruff bump may add rules - plus E4:
# lib/params.py's `noqa: E402` imports sit in their sections on purpose.
extend-select = ["E4"]
# F401 is reported, never auto-removed: fix-on-save (VS Code) would delete an import typed before its first use.
unfixable = ["F401"]
ignore = [
    "UP032",   # "{0.bolt_dia:g} ...".format(cfg.housing) reads better than repeating the path in an f-string
    "SIM118",  # `key in P.keys()`: lib/placements.py keys() is a filtering function, not dict.keys()
    "DTZ011",  # date.today(): manifests carry the local date, like CHANGELOG.md
]

[tool.ruff.lint.per-file-ignores]
# the re-export hubs keep their packed name grids (isort would put one name per line)
"lib/params.py" = ["I001"]
"lib/cycloidal/__init__.py" = ["I001"]
"lib/forearm/__init__.py" = ["I001"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
